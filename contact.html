   <div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-10">

            <div class="card shadow border-0">

                <div class="card-body p-4 p-md-5">

                    <h2 class="text-center fw-bold mb-4">
                        FILL YOUR DETAILS
                    </h2>

                    <form>

                        <!-- Full Name -->
                        <div class="mb-3">

                            <label for="fullname"
                                class="form-label fw-semibold">
                                Full Name:
                            </label>

                            <input
                                type="text"
                                id="fullname"
                                name="fullname"
                                class="form-control"
                                placeholder="Enter Your Full Name"
                                required>

                        </div>


                       


                      

                        <!-- Email -->
                        <div class="mb-3">

                            <label for="email"
                                class="form-label fw-semibold">
                                Email Address:
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter Your Email"
                                required>

                        </div>


                     

                     
                        <!-- Address -->
                        <div class="mb-3">

                            <label for="address"
                                class="form-label fw-semibold">
                                Address:
                            </label>

                            <textarea
                                id="address"
                                name="address"
                                class="form-control"
                                rows="4"
                                placeholder="Enter Your Address"
                                required></textarea>

                        </div>


                        <!-- Submit -->
                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg">
                                SUBMIT APPLICATION
                            </button>

                        </div>

                    </form>

                </div>
