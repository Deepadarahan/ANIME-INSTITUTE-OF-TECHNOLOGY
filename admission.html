 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="admission.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="navbar">HOME</a>
            <a href="courses.html" class="navbar">COURSES</a>
            <a href="admission.html" class="navbar">ADMISSION</a>
            <a href="contact.html" class="navbar">CONTACT</a>
        </nav>
    </header>

    <header class="header">
        <div>
            <h1>ADMISSION FORM</h1>
            <h4>Apply Now For 2026-27</h4>
        </div>

    </header>
    <!-- Form -->
<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-10">

            <div class="card shadow border-0">

                <div class="card-body p-4 p-md-5">

                    <h2 class="text-center fw-bold mb-4">
                        FILL YOUR DETAILS
                    </h2>

                    <form>

                        <!-- Full Name -->
                        <div class="mb-3">

                            <label for="fullname"
                                class="form-label fw-semibold">
                                Full Name:
                            </label>

                            <input
                                type="text"
                                id="fullname"
                                name="fullname"
                                class="form-control"
                                placeholder="Enter Your Full Name"
                                required>

                        </div>


                        <!-- Date of Birth -->
                        <div class="mb-3">

                            <label for="dob"
                                class="form-label fw-semibold">
                                Date Of Birth:
                            </label>

                            <input
                                type="date"
                                id="dob"
                                name="dob"
                                class="form-control"
                                required>

                        </div>


                        <!-- Gender -->
                        <div class="mb-3">

                            <label for="gender"
                                class="form-label fw-semibold">
                                Gender:
                            </label>

                            <select
                                id="gender"
                                name="gender"
                                class="form-select"
                                required>

                                <option value="" selected disabled>
                                    -- Select Gender --
                                </option>

                                <option value="male">
                                    Male
                                </option>

                                <option value="female">
                                    Female
                                </option>

                            </select>

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label for="email"
                                class="form-label fw-semibold">
                                Email Address:
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter Your Email"
                                required>

                        </div>


                        <!-- Phone -->
                        <div class="mb-3">

                            <label for="phone"
                                class="form-label fw-semibold">
                                Phone Number:
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                class="form-control"
                                placeholder="Enter Your Phone Number"
                                required>

                        </div>


                        <!-- Course -->
                        <div class="mb-3">

                            <label for="course"
                                class="form-label fw-semibold">
                                Select Course:
                            </label>

                            <select
                                id="course"
                                name="course"
                                class="form-select"
                                required>

                                <option value="" selected disabled>
                                    -- Select Course --
                                </option>

                                <option>
                                    B.Sc. Animation & Multimedia
                                </option>

                                <option>
                                    B.Des. Animation & VFX
                                </option>

                                <option>
                                    B.A. Digital Arts & Animation
                                </option>

                                <option>
                                    B.Tech Animation & Game Technology
                                </option>

                                <option>
                                    M.Sc. Animation & VFX
                                </option>

                                <option>
                                    M.Des. Animation & Visual Design
                                </option>

                                <option>
                                    MBA – Media & Entertainment
                                </option>

                                <option>
                                    2D Animation
                                </option>

                                <option>
                                    3D Animation
                                </option>

                                <option>
                                    VFX & Compositing
                                </option>

                                <option>
                                    Anime Character Design
                                </option>

                            </select>

                        </div>


                        <!-- Address -->
                        <div class="mb-3">

                            <label for="address"
                                class="form-label fw-semibold">
                                Address:
                            </label>

                            <textarea
                                id="address"
                                name="address"
                                class="form-control"
                                rows="4"
                                placeholder="Enter Your Address"
                                required></textarea>

                        </div>


                        <!-- Percentage -->
                        <div class="mb-4">

                            <label for="percentage"
                                class="form-label fw-semibold">
                                10th/12th Percentage:
                            </label>

                            <input
                                type="number"
                                id="percentage"
                                name="percentage"
                                class="form-control"
                                placeholder="Enter Percentage"
                                min="0"
                                max="100"
                                step="0.01"
                                required>

                        </div>


                        <!-- Submit -->
                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg">
                                SUBMIT APPLICATION
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
   <div class="footer-div">
        <div class="footer">
            <h1>© 2026 ANIME INSTITUTE OF TECHNOLOGY. ALL RIGHTS RESERVED.</h1>
        </div>
    </div>
</body>

</html>
